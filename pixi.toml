[workspace]
name = "RadioSim"
version = "0.2.0"
description = "A Python application for simulating and visualizing complex interferometric visibilities."
authors = ["Kartik Mandar <kartik4321mandar@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tasks]
# New CLI entry points (v0.2.0+)
simulate = "radiosim simulate"
init = "radiosim init"
validate = "radiosim validate"

# Development tools
lint = "ruff check ."
fix = "ruff check --fix ."
format = "ruff format ."
check-format = "ruff format --check ."
typecheck = "python tools/check_pyright_baseline.py"
typecheck-report = "python -m pyright"
typecheck-update = "python tools/check_pyright_baseline.py --update"
# Parallel by default (pytest-xdist); pass `-- -n 0` to force a serial run.
# No explicit `tests/` here: pyproject's `testpaths` already supplies it, and a
# hardcoded path would make `pixi run test -- <file>` collect the whole suite.
test = "python -m pytest -n auto"
# Docstring doctests, scoped to the package and run as a separate invocation so
# a bare `pixi run test` collects exactly what it collected before
# (Tier8ReleasePlan.md Section 9 item 3). `-p no:cacheprovider` keeps the run
# from writing a `.pytest_cache` next to the sources.
doctest = "python -m pytest --doctest-modules src/radiosim -p no:cacheprovider"
# Reproducible backend benchmarks (Tier6HybridRuntimePlan.md Sections 22, 23).
# Never part of the gate: the performance tests are marked `performance` and
# `slow`, so `pixi run test -- -m "not slow"` and CI exclude them. Records land
# in `output/benchmarks/<UTC timestamp>-<host tag>.json`.
bench = "python -m pytest tests/performance/ -m performance"
pre-commit-install = "pre-commit install"

[dependencies]
python = "*"
pip = "*"
# Numba (pulled by optional sky-model tooling) currently requires NumPy <2.5.
numpy = ">=1.24,<2.5"
# Keep PySM's Numba dependency on Conda to avoid unsupported PyPI source builds.
numba = ">=0.64,<0.67"
matplotlib = "*"
astropy = "*"
bokeh = "*"
plotly = "*"
astroquery = "*"
pyyaml = "*"
pyuvdata = "==3.2.1"
tqdm = "*"
h5py = "*"
healpy = "*"
pympler = "*"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
scipy = "*"
ruff = "*"
pyright = "==1.1.408"
pre-commit = "*"
sphinx = ">=8.2.3,<9"
sphinx-rtd-theme = ">=3.0.2,<4"
myst-parser = ">=4.0.1,<5"
numpydoc = ">=1.10.0,<2"
python-casacore = ">=3.7.1,<4"
rich = ">=14.2.0,<15"
click = ">=8.0"
nbconvert = ">=7.17.0,<8"
jupyter = ">=1.1.1,<2"
pytest-cov = ">=7.0.0,<8"
pytest-xdist = ">=3.6.1,<4"
ipykernel = ">=7.2.0,<8"
reproject = ">=0.18.0,<0.20"

[pypi-dependencies]
pygdsm = "*"
pyradiosky = "*"
pysm3 = "*"
radiosim = { path = ".", editable = true }

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

# CPU-only JAX, so the mandated NumPy/JAX backend-parity evidence is actually
# measured rather than skipped (Tier6HybridRuntimePlan.md Sections 28, 32.8).
# The `cpu*` build constraint is load-bearing: conda-forge also ships CUDA
# `jaxlib` variants on the Linux subdirs, and RadioSim makes no accelerator
# claim. This feature is carried by every declared environment so that the
# parity tests run in the standard gate on all six env x platform combinations.
[feature.jax-cpu.dependencies]
jax = ">=0.10.2,<0.11"
jaxlib = { version = ">=0.10.2,<0.11", build = "cpu*" }

# Optional cross-implementation validation reference (Tier7JonesSciencePlan.md
# Sections 29 and 41's question Q1). `pyuvsim` is a PyPI-only package -- it has
# no conda-forge build (`api.anaconda.org/package/conda-forge/pyuvsim` is a 404),
# so it is declared here rather than under `[dependencies]`. The version is
# pinned to `1.4.0` because it is the newest release whose metadata is
# satisfiable against this repository's `pyuvdata ==3.2.1`; `1.4.2` requires
# `pyuvdata >=3.2.3`. The wheel is `pyuvsim-1.4.0-py3-none-any.whl`, pure
# Python, so every platform resolves. This feature is carried by exactly one
# environment, which no CI job builds and no gate runs: the comparison it
# supports is Section 29's Tier-2 evidence, recorded and never gating.
[feature.crossval.pypi-dependencies]
pyuvsim = "==1.4.0"

[environments]
default = { features = ["py311", "jax-cpu"], solve-group = "py311" }
py312 = ["py312", "jax-cpu"]
# Same solve group as `default`, so the two environments share one solve and
# `crossval` is `default` plus `pyuvsim` and nothing else. Without the shared
# group pixi solves a new environment from scratch and drifts several hundred
# packages away from the gating stack, which would make any comparison run in
# it evidence about a different build of RadioSim.
crossval = { features = ["py311", "jax-cpu", "crossval"], solve-group = "py311" }
