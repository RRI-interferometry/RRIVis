[workspace]
name = "RadioSim"
version = "0.2.0"
description = "A Python application for simulating and visualizing complex interferometric visibilities."
authors = ["Kartik Mandar <kartik4321mandar@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tasks]
# New CLI entry points (v0.2.0+)
simulate = "radiosim simulate"
init = "radiosim init"
validate = "radiosim validate"

# Development tools
lint = "ruff check ."
fix = "ruff check --fix ."
format = "ruff format ."
check-format = "ruff format --check ."
typecheck = "python tools/check_pyright_baseline.py"
typecheck-report = "python -m pyright"
typecheck-update = "python tools/check_pyright_baseline.py --update"
test = "python -m pytest tests/"
pre-commit-install = "pre-commit install"

[dependencies]
python = "*"
pip = "*"
# Numba (pulled by optional sky-model tooling) currently requires NumPy <2.5.
numpy = ">=1.24,<2.5"
# Keep PySM's Numba dependency on Conda to avoid unsupported PyPI source builds.
numba = ">=0.64,<0.67"
matplotlib = "*"
astropy = "*"
bokeh = "*"
plotly = "*"
astroquery = "*"
pyyaml = "*"
pyuvdata = "==3.2.1"
tqdm = "*"
h5py = "*"
healpy = "*"
pympler = "*"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
scipy = "*"
ruff = "*"
pyright = "==1.1.408"
pre-commit = "*"
sphinx = ">=8.2.3,<9"
sphinx-rtd-theme = ">=3.0.2,<4"
myst-parser = ">=4.0.1,<5"
numpydoc = ">=1.10.0,<2"
python-casacore = ">=3.7.1,<4"
rich = ">=14.2.0,<15"
click = ">=8.0"
nbconvert = ">=7.17.0,<8"
jupyter = ">=1.1.1,<2"
pytest-cov = ">=7.0.0,<8"
ipykernel = ">=7.2.0,<8"
reproject = ">=0.18.0,<0.20"

[pypi-dependencies]
pygdsm = "*"
pyradiosky = "*"
pysm3 = "*"
radiosim = { path = ".", editable = true }

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[environments]
default = ["py311"]
py312 = ["py312"]
