name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.platform }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # `actions: read` is what `gh run list`/`gh run download` need to restore
    # the previous successful run's characterization record (CI-001).
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-24.04
            python: "3.11"
            environment: default
            key: linux-64-py311
          - platform: linux-64
            runner: ubuntu-24.04
            python: "3.12"
            environment: py312
            key: linux-64-py312
          - platform: osx-64
            runner: macos-15-intel
            python: "3.11"
            environment: default
            key: osx-64-py311
          - platform: osx-64
            runner: macos-15-intel
            python: "3.12"
            environment: py312
            key: osx-64-py312
          - platform: osx-arm64
            runner: macos-15
            python: "3.11"
            environment: default
            key: osx-arm64-py311
          - platform: osx-arm64
            runner: macos-15
            python: "3.12"
            environment: py312
            key: osx-arm64-py312
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history: the phase-aware PERF-001 acceptance-chain tests in
          # tests/unit/test_perf001_cpu_evidence.py read the generating source
          # commit `S` via `git show <S>:<path>`, which a depth-1 clone cannot
          # serve (every cell of run 31577475227 failed exactly that way).
          fetch-depth: 0

      - name: Install locked Pixi environment
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.72.2
          environments: ${{ matrix.environment }}
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Confirm Python version
        run: pixi run --environment ${{ matrix.environment }} -- python -VV

      # CI-001. The characterization pins capture a reference cube on the pass
      # path, but only under gitignored output/, which this runner discards when
      # the job ends. Restoring the previous successful run's record for this
      # exact matrix cell is what lets a divergent digest report `max|dV|`
      # against a cube that was measured while its digest still matched -- the
      # difference between a failing log with two hex strings in it and one with
      # a number. Best effort in every direction: a first run, a deleted
      # artifact, or a missing token leaves the directory empty and the tests
      # behave exactly as they did before.
      - name: Restore the previous characterization record (CI-001)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_ARTIFACT: characterization-${{ matrix.key }}
        run: |
          mkdir -p output/characterization output/characterization-previous
          previous="$(gh run list --workflow "${{ github.workflow }}" \
            --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId' || true)"
          if [ -n "$previous" ]; then
            gh run download "$previous" --name "$RECORD_ARTIFACT" \
              --dir output/characterization \
              || echo "no $RECORD_ARTIFACT artifact on run $previous"
          else
            echo "no previous successful run to restore from"
          fi
          # Stash the previous green run's fingerprints next door: this run's
          # session would overwrite the same filenames, and the failure path
          # below wants to diff the two (CI-001, WP-2).
          mv output/characterization/machine-fingerprint-*.txt \
            output/characterization-previous/ 2>/dev/null || true
          # Passing pins now retain their measured digest class. Never append
          # this run to the previous run's manifest or the artifact would mix
          # two observations and cease to have one provenance.
          mv output/characterization/observed-digests-*.tsv \
            output/characterization-previous/ 2>/dev/null || true
          find output/characterization output/characterization-previous \
            -type f | head -50

      - name: Run non-slow tests
        run: >-
          pixi run --environment ${{ matrix.environment }}
          test -- -m "not slow"

      # CI-001, WP-2. On a characterization failure the adjudication evidence
      # is the field-level difference between this runner's fingerprint and
      # the restored previous-green one — print it in the failing log so no
      # artifact archaeology is needed. Purely diagnostic: it never fails.
      - name: Diff the fingerprint against the previous green run (CI-001)
        if: failure()
        continue-on-error: true
        run: |
          fields='^(environment key|cpu model|numpy dispatched features|thread environment|blas build|libc|runner image|numpy runtime|cpu topology|cache topology):'
          extract() { grep -hE "$fields" "$@" 2>/dev/null | sort -u; }
          if ! ls output/characterization-previous/machine-fingerprint-*.txt >/dev/null 2>&1; then
            echo "no previous-green fingerprint was restored; nothing to diff"
            exit 0
          fi
          echo "=== fingerprint fields: previous green run ==="
          extract output/characterization-previous/machine-fingerprint-*.txt
          echo "=== fingerprint fields: this run ==="
          extract output/characterization/machine-fingerprint-*.txt
          echo "=== field-level diff (previous green run vs this run) ==="
          diff <(extract output/characterization-previous/machine-fingerprint-*.txt) \
               <(extract output/characterization/machine-fingerprint-*.txt) \
            && echo "no fingerprint field differs" || true

      # CI-001. Emitted unconditionally since Tier 8A, on pass as well as fail:
      # before this, nothing had ever been recorded about a runner that produced
      # an *accepted* digest, which is the single largest reason the
      # linux-64-py311 divergence is undiagnosable.
      - name: Surface the machine fingerprint (CI-001)
        if: always()
        run: |
          for record in output/characterization/machine-fingerprint-*.txt; do
            [ -f "$record" ] || continue
            echo "=== $record ==="
            cat "$record"
          done

      - name: Upload the characterization record (CI-001)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: characterization-${{ matrix.key }}
          path: output/characterization/
          if-no-files-found: warn
          retention-days: 30

  linux-preimage-diagnostic:
    name: Linux production-v2 preimage / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            environment: default
          - python: "3.12"
            environment: py312
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.72.2
          environments: ${{ matrix.environment }}
          locked: true
          cache: true
      - name: Run both existing preimage tests with full failure details
        run: |
          mkdir -p output/ci-preimage
          pixi run --environment ${{ matrix.environment }} -- python -m pytest \
            -p no:xdist -p tools.ci_non_slow_partition -vv --tb=long \
            --ci-diagnostic-output=output/ci-preimage \
            --junit-xml=output/ci-preimage/results.xml \
            tests/unit/test_sci004_phase3_evidence.py::test_production_v2_retains_the_complete_owned_input_preimage \
            tests/unit/test_sci004_phase3_evidence.py::test_production_v2_rejects_a_rehashed_foreign_phase_against_unchanged_result
      - name: Preserve targeted diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-preimage-py${{ matrix.python }}
          path: output/ci-preimage/
          if-no-files-found: warn
          retention-days: 30

  backend-parity:
    name: NumPy/JAX-CPU backend parity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install locked default Pixi environment
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.72.2
          environments: default
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Confirm the locked CPU-only JAX is importable
        run: >-
          pixi run -- python -c
          "import jax, jaxlib; print(jax.__version__, jaxlib.__version__, jax.devices())"

      - name: Run the backend parity and compilation-boundary suites
        run: >-
          pixi run -- python -m pytest tests/unit/test_backends/
          tests/unit/test_core/test_visibility_backend.py
          tests/unit/test_jones/test_backend_jones.py

  quality:
    name: Lint, metadata, types, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install locked default Pixi environment
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.72.2
          environments: default
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Run Ruff lint
        run: pixi run lint

      - name: Check Ruff formatting
        run: pixi run check-format

      - name: Check release metadata and lock format
        run: pixi run -- python -m pytest tests/unit/test_release_metadata.py

      - name: Enforce strict Pyright error ceiling
        run: pixi run typecheck

      - name: Run the package doctests
        run: pixi run doctest

      - name: Run the example script
        run: |
          pixi run -- python examples/scripts/simple_simulation.py --help
          pixi run -- python examples/scripts/simple_simulation.py

      - name: Execute the example notebook
        run: >-
          pixi run -- jupyter nbconvert --to notebook --execute --stdout
          examples/notebooks/01_basic_usage.ipynb

      # Since Tier 8C, docs/Makefile defaults SPHINXOPTS to warnings-as-errors
      # plus keep-going, so this unchanged command *is* the strict docs gate.
      # The workflow deliberately passes no Sphinx option of its own: the
      # Makefile default is the single place that flag lives, and
      # tests/characterization/test_tier8_current_behavior.py asserts this file
      # carries none.
      - name: Build Sphinx documentation
        run: make -C docs html

      - name: Confirm the working tree is unchanged by the quality steps
        run: git diff --exit-code && test -z "$(git status --porcelain)"
