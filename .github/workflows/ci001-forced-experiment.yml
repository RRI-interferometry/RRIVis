# CI-001, WP-3 (PostTier8RemediationPlan.md Section 5.3): the forced
# discrimination experiment. Across all eight classified observations in the
# WP-2 harvest, AVX512-dispatching runners correlate perfectly with the
# divergent digest class and the AVX2-only runner with the green class, and
# the register's earlier "falsification" of the feature-set theory is
# suspected to be hypervisor CPU-feature masking (same CPU model string,
# different exposed features). This workflow forces both classes to appear on
# a single runner by masking the dispatch axes one at a time:
#
#   V1  control -- no overrides
#   V2  NPY_DISABLE_CPU_FEATURES set to every AVX512 feature the runner
#       actually reports (built dynamically from numpy __cpu_features__;
#       masks NumPy's own SIMD dispatch, not OpenBLAS's)
#   V3  OPENBLAS_CORETYPE=HASWELL (forces the AVX2-era BLAS kernels; the
#       probe records whether the build actually honoured it)
#   V4  both V2 and V3
#
# If a divergent-class draw flips to the green digests under a mask, the
# discriminator is named with on-demand reproduction, and the failure logs'
# numeric deltas against the restored green reference cubes are the
# class-vs-class measurement Tier8ReleasePlan.md Section 14 adjudicates
# against (the Section 13.5 rtol=1e-12 criterion). The class-vs-class delta
# has never been measured before this experiment.
#
# The divergent runner draw is ~38% on this cell, so six independent jobs
# give ~94% odds of at least one divergent draw.
#
# workflow_dispatch only. Required by nothing, blocking nothing, gating
# nothing: every variant run is continue-on-error, and the artifacts upload
# under ci001-experiment-* -- never under characterization-* -- so the main
# CI restore chain (ci.yml:85-101) is not polluted.
name: CI-001 forced discrimination experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    name: forced discrimination draw ${{ matrix.draw }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # `actions: read` is what `gh run list`/`gh run download` need to restore
    # the latest green CI run's characterization record (CI-001).
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        draw: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install locked Pixi environment
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.72.2
          environments: default
          locked: true
          cache: true
          cache-write: false

      # Same restore as ci.yml:85-101 and the nightly sampler, pointed at the
      # CI workflow's last green main run. The green class's reference cubes
      # are what every divergent variant's failure log subtracts from: without
      # them a red run prints two hex strings, with them it prints max|dV|,
      # the max relative delta, the differing-element count, and the nearest
      # recorded observation -- the Section 14 measurement itself.
      - name: Restore the latest green CI characterization record (CI-001)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_ARTIFACT: characterization-linux-64-py311
        run: |
          mkdir -p output/green-reference
          previous="$(gh run list --workflow CI \
            --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId' || true)"
          if [ -n "$previous" ]; then
            echo "$previous" > output/green-reference/source-run-id.txt
            gh run download "$previous" --name "$RECORD_ARTIFACT" \
              --dir output/green-reference \
              || echo "no $RECORD_ARTIFACT artifact on run $previous"
          else
            echo "no previous successful CI run to restore from"
          fi
          find output/green-reference -type f | head -50

      - name: Write the probe and variant-runner scripts
        run: |
          cat > "$RUNNER_TEMP/ci001_probe.py" <<'PROBE'
          """CI-001 probe: what NumPy and OpenBLAS actually dispatch under this env."""
          import ctypes
          import os
          import platform

          import numpy as np

          print(f"python {platform.python_version()} numpy {np.__version__}")
          print(f"platform: {platform.platform()}")
          for name in ("NPY_DISABLE_CPU_FEATURES", "OPENBLAS_CORETYPE"):
              print(f"{name}={os.environ.get(name, '<unset>')}")
          try:
              from numpy._core._multiarray_umath import (
                  __cpu_features__ as cpu_features,
              )

              enabled = ",".join(sorted(n for n, on in cpu_features.items() if on))
              print(f"numpy dispatched features: {enabled}")
          except Exception as error:
              print(f"numpy dispatched features: unavailable ({error})")
          for soname in ("libblas.so.3", "libopenblas.so.0"):
              try:
                  library = ctypes.CDLL(soname)
                  library.openblas_get_corename.restype = ctypes.c_char_p
                  core = library.openblas_get_corename()
                  print(
                      f"openblas runtime core: "
                      f"{(core or b'?').decode('ascii', 'replace')} (via {soname})"
                  )
                  break
              except (OSError, AttributeError):
                  continue
          else:
              print("openblas runtime core: unavailable")
          print(f"os.cpu_count()={os.cpu_count()}")
          try:
              print(f"sched_getaffinity={len(os.sched_getaffinity(0))}")
          except Exception:
              pass
          print("--- numpy.show_runtime() ---")
          np.show_runtime()
          PROBE
          cat > "$RUNNER_TEMP/ci001-run-variant.sh" <<'RUNNER'
          #!/usr/bin/env bash
          # One experiment variant: probe the dispatch under the caller's env
          # overrides, then run the tier6 characterization module with its own
          # record directory, seeded with the green reference cubes so every
          # pin failure prints a numeric delta.
          set -uo pipefail
          variant="$1"
          dir="output/experiment/${variant}"
          mkdir -p "${dir}/record"
          if [ -d output/green-reference/reference_cubes ]; then
            cp -R output/green-reference/reference_cubes "${dir}/record/"
          fi
          export RADIOSIM_CHARACTERIZATION_RECORD_DIR="${PWD}/${dir}/record"
          pixi run -- python "${RUNNER_TEMP}/ci001_probe.py" \
            > "${dir}/runtime-probe.txt" 2>&1
          pixi run test -- tests/characterization/test_tier6_current_behavior.py \
            -m "not slow" 2>&1 | tee "${dir}/pytest.log"
          status=${PIPESTATUS[0]}
          echo "${status}" > "${dir}/pytest-exit-code.txt"
          echo "variant ${variant}: pytest exited ${status}"
          exit "${status}"
          RUNNER
          chmod +x "$RUNNER_TEMP/ci001-run-variant.sh"

      # The un-overridden dispatch state and the canonical machine fingerprint,
      # recorded before any variant runs. The --collect-only invocation exists
      # because importing the tier6 module is what writes the fingerprint file
      # (unconditional since Tier 8A); collection imports without running a
      # single test.
      - name: Record the runner baseline before any variant runs
        run: |
          mkdir -p output/experiment/baseline
          pixi run -- python "$RUNNER_TEMP/ci001_probe.py" \
            > output/experiment/baseline/runtime-probe.txt 2>&1
          lscpu > output/experiment/baseline/lscpu.txt 2>&1 || true
          RADIOSIM_CHARACTERIZATION_RECORD_DIR="$PWD/output/experiment/baseline" \
            pixi run test -- \
            tests/characterization/test_tier6_current_behavior.py \
            --collect-only -q > /dev/null 2>&1 || true
          cat output/experiment/baseline/runtime-probe.txt

      # V2's mask list is built from what this runner actually reports, never
      # hardcoded: a green-class (AVX2-only) draw yields an empty list, and V2
      # then honestly degenerates to a second control run.
      - name: Build the AVX512 mask list from what this runner reports
        run: |
          mask="$(pixi run -- python -c "from numpy._core._multiarray_umath import __cpu_features__ as f; print(','.join(sorted(n for n, on in f.items() if on and n.startswith('AVX512'))))")"
          echo "AVX512_MASK=$mask" >> "$GITHUB_ENV"
          echo "AVX512 features enabled on this runner: ${mask:-<none>}"

      - name: "V1 control: no overrides"
        continue-on-error: true
        run: bash "$RUNNER_TEMP/ci001-run-variant.sh" V1

      - name: "V2: NPY_DISABLE_CPU_FEATURES masks every reported AVX512 feature"
        continue-on-error: true
        env:
          NPY_DISABLE_CPU_FEATURES: ${{ env.AVX512_MASK }}
        run: bash "$RUNNER_TEMP/ci001-run-variant.sh" V2

      - name: "V3: OPENBLAS_CORETYPE=HASWELL forces the AVX2-era BLAS kernels"
        continue-on-error: true
        env:
          OPENBLAS_CORETYPE: HASWELL
        run: bash "$RUNNER_TEMP/ci001-run-variant.sh" V3

      - name: "V4: both the NumPy mask and the OpenBLAS core override"
        continue-on-error: true
        env:
          NPY_DISABLE_CPU_FEATURES: ${{ env.AVX512_MASK }}
          OPENBLAS_CORETYPE: HASWELL
        run: bash "$RUNNER_TEMP/ci001-run-variant.sh" V4

      - name: Summarize the four variants
        if: always()
        run: |
          {
            echo "CI-001 forced discrimination: run ${GITHUB_RUN_ID}, draw ${{ matrix.draw }}"
            echo "green reference restored from CI run: $(cat output/green-reference/source-run-id.txt 2>/dev/null || echo '<none>')"
            echo "AVX512 mask list: ${AVX512_MASK:-<empty>}"
            for variant in V1 V2 V3 V4; do
              dir="output/experiment/${variant}"
              echo ""
              echo "=== ${variant} ==="
              echo "pytest exit code: $(cat "${dir}/pytest-exit-code.txt" 2>/dev/null || echo '<missing>')"
              grep -E "NPY_DISABLE_CPU_FEATURES|OPENBLAS_CORETYPE|numpy dispatched features|openblas runtime core" \
                "${dir}/runtime-probe.txt" 2>/dev/null || true
              grep -hF -e "measured: " -e "recorded: " -e "max|dV|" \
                -e "Section 13.5 verdict" \
                -e "nearest recorded observation" -e "numeric delta" \
                "${dir}/pytest.log" 2>/dev/null | sed 's/^ *//' | sort -u || true
            done
          } | tee output/experiment/summary.txt

      # Distinct name, never characterization-*: the main CI restore chain and
      # the nightly sampler must never pick an experiment record up as a green
      # reference. The seeded reference cubes are excluded -- they are copies
      # of the restored CI artifact, which remains the canonical source (a
      # observed-digest TSV manifests are retained, so the comparator can name
      # either accepted class even when pytest passes after WP-3. Reference
      # cubes remain owned by the main CI characterization artifact.
      - name: Upload the experiment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci001-experiment-${{ github.run_id }}-draw${{ matrix.draw }}
          path: |
            output/experiment/
            !output/experiment/**/reference_cubes/**
            output/green-reference/source-run-id.txt
            output/green-reference/machine-fingerprint-*.txt
          if-no-files-found: warn
          retention-days: 30
