[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiosim"
version = "0.2.0"
description = "Radio interferometric Visibility Simulator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kartik Mandar", email = "kartik4321mandar@gmail.com"}
]
keywords = [
    "radio-astronomy",
    "interferometry",
    "visibility",
    "simulation",
    "rime",
    "hera",
    "polarization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.24.0",
    "astropy>=5.0",
    "scipy>=1.10",
    "healpy>=1.16",
    "h5py>=3.8",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "astroquery>=0.4",
    "pygdsm>=1.5",
    "pyradiosky>=1.0",
    "pysm3>=3.3",
    "pyuvdata>=2.4",
    "bokeh>=3.0",
    "matplotlib>=3.7",
    "plotly>=5.14",
    "tqdm>=4.65",
    "pympler>=1.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
# The JAX backend. One extra, named for the library it installs rather than
# for a device: the `gpu`, `gpu-cuda`, `gpu-rocm` and `tpu` extras were removed
# in Tier 8E because installing them delivered a package that has never
# executed on an accelerator. RadioSim's only compiled kernel is a
# per-(time, frequency) contraction inside host-side Python loops, every
# measured JAX run is slower than NumPy (records: output/benchmarks/reference/),
# and no GPU or TPU run has ever been measured. A device-named extra returns
# when PERF-001 closes with measurements behind it; a user who supplies their
# own accelerator hardware installs the vendor JAX wheel directly.
jax = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
]

# NumPy/Dask backend (renamed from `numba` in Tier 6H: that backend never
# compiled a kernel, so the extra no longer pulls Numba in its name)
dask = [
    "dask[complete]>=2024.1.0",
]

# Measurement Set I/O
ms = [
    "python-casacore>=3.5",
    "xarray>=2023.1",
]

# Development dependencies
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "pyright>=1.1",
    "ipython>=8.12",
    "jupyter>=1.0",
]

# Documentation
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "numpydoc>=1.6",
]

# All extras (development)
all = [
    "radiosim[jax,dask,ms,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/RRI-interferometry/RadioSim"
Documentation = "https://radiosim.readthedocs.io"
Repository = "https://github.com/RRI-interferometry/RadioSim"
Issues = "https://github.com/RRI-interferometry/RadioSim/issues"

[project.scripts]
radiosim = "radiosim.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radiosim = ["py.typed", "core/sky/data/footprints/*.npz"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# `--doctest-modules` deliberately does NOT live here.  With
# `testpaths = ["tests"]` it never reached `src/`, so it collected zero doctest
# items while implying that the 299 `>>>` lines in `src/radiosim` were covered.
# Docstring doctests are now a separate, really-executed invocation: the
# `doctest` pixi task (Tier8ReleasePlan.md Section 9 item 3).
addopts = [
    "-v",
    "--tb=short",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:cannot collect test class.*SourcesConfig.*:pytest.PytestCollectionWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
    "integration: marks integration tests",
    "performance: marks performance/benchmark tests",
    "crossval: marks cross-implementation comparisons that need the optional `crossval` pixi environment (also marked slow, so the standard gate deselects them)",
]

# Ruff configuration (linter + formatter)
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["simulators"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["radiosim"]

# Pyright configuration
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src/radiosim"]
exclude = [
    "docs/_build",
    "examples/notebooks",
    "**/__pycache__",
]
extraPaths = ["src"]
venvPath = ".pixi/envs"
venv = "default"
reportImplicitOverride = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"
reportUnusedCallResult = "error"

# Coverage configuration
[tool.coverage.run]
source = ["src/radiosim"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 70
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"
