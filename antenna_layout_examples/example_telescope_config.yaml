# Complete strict RadioSim configuration using the native layout beside it.

instrument:
  source:
    kind: layout_file
    path: example_radiosim_format.txt
    format: radiosim
    telescope_name: Example Array
  location:
    longitude_deg: 21.4283
    latitude_deg: -30.7215
    height_m: 1050.0
  default_diameter_m: 14.0
  diameter_overrides: []

baseline_selection:
  correlations: all
  length_filter: null
  azimuth_ranges_deg: []

obs_time:
  start_time: "2025-01-01T00:00:00"
  duration_seconds: 1.0
  time_step_seconds: 1.0

obs_frequency:
  mode: explicit
  channel_frequencies_hz: [150000000.0]
  channel_widths_hz: [1000000.0]

sky_model:
  sources:
    - kind: test_sources
      num_sources: 3
      seed: 7

beams:
  mode: analytic
  model:
    kind: circular_aperture
    taper:
      kind: gaussian
      edge_taper_db: 10.0

execution:
  backend: numpy
  precision:
    preset: standard
  simulator: rime
  offline: true

workflow:
  output_dir: output
  result_format: hdf5
  collision_policy: error
  save_results: false
  plot_results: false
  open_plots_in_browser: false
  save_log: false
