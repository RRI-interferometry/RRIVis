# Realistic foreground recipe for a small HERA-like simulation.
#
# The sky recipe combines a prepared Haslam diffuse template with bright GLEAM
# sources. It may require network access and optional sky-model dependencies at
# simulation time. `radiosim validate` checks the configuration without loading
# either model.

instrument:
  source:
    kind: layout_file
    path: ../antenna_layout_examples/hera_5.txt
    format: radiosim
    telescope_name: HERA
  location:
    longitude_deg: 21.4283
    latitude_deg: -30.72152
    height_m: 1073.0
  default_diameter_m: 14.0
  diameter_overrides: []

beams:
  mode: analytic
  model:
    kind: circular_aperture
    taper:
      kind: gaussian
      edge_taper_db: 10.0

baseline_selection:
  correlations: all
  length_filter: null
  azimuth_ranges_deg: []

obs_time:
  start_time: "2026-01-01T00:00:00"
  duration_seconds: 600.0
  time_step_seconds: 60.0

obs_frequency:
  mode: grid
  starting_frequency: 150.0
  frequency_interval: 1.0
  frequency_bandwidth: 10.0
  channel_width: 1.0
  frequency_unit: MHz

sky_model:
  flux_unit: Jy
  mixed_model_policy: error
  region:
    shape: cone
    center_ra_deg: 180.0
    center_dec_deg: -30.0
    radius_deg: 10.0
  sources:
    - kind: realistic_foreground
      diffuse: haslam
      bright_catalogs: gleam
      bright_catalog_flux_min_jy: 3.5
      nside: 128
      include_cmb: false
      seed: 42

visibility:
  calculation_type: direct_sum
  sky_representation: healpix_map

execution:
  backend: numpy
  precision:
    preset: standard
  simulator: rime
  offline: false

workflow:
  output_dir: output
  run_subdir: realistic_foreground
  result_filename: realistic_foreground
  result_format: hdf5
  save_results: true
  collision_policy: error
  plot_results: false
  open_plots_in_browser: false
  plotting_backend: bokeh
  save_log: false
