# Realistic foreground recipe for a small HERA-like simulation.
#
# The sky recipe combines a prepared Haslam diffuse template with bright GLEAM
# sources. It may require network access and optional sky-model dependencies at
# simulation time. `radiosim validate` checks the configuration without loading
# either model.

telescope:
  telescope_name: HERA

antenna_layout:
  antenna_positions_file: ../antenna_layout_examples/hera_5.txt
  antenna_file_format: radiosim
  all_antenna_diameter: 14.0

beams:
  beam_mode: analytic
  aperture_shape: circular
  taper: gaussian
  edge_taper_dB: 10.0
  feed_model: none
  reflector_type: prime_focus

baseline_selection:
  use_autocorrelations: true
  use_crosscorrelations: true

location:
  lat: -30.72152
  lon: 21.4283
  height: 1073.0

obs_time:
  start_time: "2026-01-01T00:00:00"
  duration_seconds: 600.0
  time_step_seconds: 60.0

obs_frequency:
  mode: grid
  starting_frequency: 150.0
  frequency_interval: 1.0
  frequency_bandwidth: 10.0
  frequency_unit: MHz

sky_model:
  flux_unit: Jy
  mixed_model_policy: error
  region:
    shape: cone
    center_ra_deg: 180.0
    center_dec_deg: -30.0
    radius_deg: 10.0
  sources:
    - kind: realistic_foreground
      diffuse: haslam
      bright_catalogs: gleam
      bright_catalog_flux_min_jy: 3.5
      nside: 128
      include_cmb: false
      seed: 42

visibility:
  calculation_type: direct_sum
  sky_representation: healpix_map

execution:
  backend: numpy
  precision:
    preset: standard
  simulator: rime
  offline: false

workflow:
  output_dir: output
  run_subdir: realistic_foreground
  result_filename: realistic_foreground
  result_format: hdf5
  save_results: true
  overwrite: false
  skip_overwrite_confirmation: false
  prompt_for_output_suffix: false
  plot_results: false
  open_plots_in_browser: false
  plotting_backend: bokeh
  save_log: false
