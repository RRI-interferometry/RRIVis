instrument:
  source:
    kind: layout_file
    path: ../antenna_layout_examples/hera_5.txt
    format: radiosim
    telescope_name: HERA
  location:
    longitude_deg: 21.4283
    latitude_deg: -30.72152
    height_m: 1073.0
  default_diameter_m: 14.0
  diameter_overrides: []

beams:
  mode: analytic
  model:
    kind: circular_aperture
    taper:
      kind: gaussian
      edge_taper_db: 10.0

# Receptor model. This block is the explicit form of the default: two ideal
# orthogonal linear feeds per antenna, no feed rotation, and a linear_xy output
# basis, so the correlation axis is labelled XX, XY, YX, YY. Omitting the whole
# section is equivalent. See configs/receptor_circular_example.yaml for R/L.
receptors:
  default:
    basis: linear
    feed_rotation_deg: 0.0
  overrides: []
  output_basis: auto

baseline_selection:
  correlations: all
  length_filter: null
  azimuth_ranges_deg: []

obs_time:
  start_time: "2025-01-01T00:00:00"
  duration_seconds: 3600
  time_step_seconds: 60

obs_frequency:
  mode: grid
  starting_frequency: 50
  frequency_interval: 1.0
  frequency_bandwidth: 100
  channel_width: 1.0
  frequency_unit: MHz

sky_model:
  flux_unit: Jy
  sources:
    - kind: test_sources
      num_sources: 200
      distribution: random
      seed: 42
      flux_min: 1.0
      flux_max: 5.0
      dec_deg: -30.72
      dec_range_deg: 10.0
      spectral_index: 0

visibility:
  sky_representation: point_sources

execution:
  backend: numpy
  precision:
    preset: standard
  simulator: rime
  offline: false

workflow:
  output_dir: ../output
  run_subdir: null
  result_filename: visibilities
  result_format: hdf5
  save_results: true
  collision_policy: error
  plot_results: false
  open_plots_in_browser: false
  plotting_backend: bokeh
  save_log: false
  visibility_phase_unit: radians
